<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冷氣排程</title>
<style>
  :root{
    --ink:#0D1B24;
    --panel:#14252F;
    --line:#223C49;
    --text:#E4EEF2;
    --muted:#7D99A6;
    --cool:#6FD3E8;
    --standby:#D9963F;
    --bad:#DC6A5B;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
    font-size:16px;
    line-height:1.5;
    padding-top:env(safe-area-inset-top,0);
    padding-bottom:env(safe-area-inset-bottom,0);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px;margin:0 auto;padding:20px 18px 40px}

  /* ---- 時鐘 ---- */
  .clock{
    text-align:center;
    padding:26px 0 20px;
  }
  .clock time{
    display:block;
    font-size:64px;
    font-weight:250;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    color:var(--muted);
    transition:color .4s;
  }
  .clock.live time{color:var(--text)}
  .clock .sec{font-size:26px;font-weight:300;opacity:.55;margin-left:2px}
  .clock .src{
    font-size:13px;color:var(--muted);
    display:inline-flex;align-items:center;gap:7px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);flex:none}
  .clock.live .dot{background:var(--cool)}

  /* ---- 電源 ---- */
  .power{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:8px 0 26px;
  }
  .power button{
    font:inherit;font-size:17px;font-weight:500;
    padding:20px 0;border-radius:var(--r);
    border:1px solid var(--line);
    background:var(--panel);color:var(--text);
    cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
  }
  .power button:active{transform:translateY(1px)}
  .power button.on[aria-pressed=true]{
    background:var(--cool);border-color:var(--cool);color:#06222B;
  }
  .power button.off[aria-pressed=true]{
    background:var(--standby);border-color:var(--standby);color:#251503;
  }

  /* ---- 設定列 ---- */
  .panel{
    background:var(--panel);
    border-radius:var(--r);
    overflow:hidden;
    margin-bottom:22px;
  }
  .row{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;padding:15px 16px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none}
  .row label,.row .k{font-size:15px}
  .row .hint{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

  input[type=time]{
    font:inherit;font-size:17px;font-variant-numeric:tabular-nums;
    background:transparent;color:var(--text);
    border:1px solid var(--line);border-radius:9px;
    padding:7px 9px;
  }
  .stepper{display:flex;align-items:center;gap:4px}
  .stepper button{
    width:38px;height:38px;font:inherit;font-size:20px;
    border:1px solid var(--line);border-radius:9px;
    background:transparent;color:var(--text);cursor:pointer;
  }
  .stepper .val{
    min-width:62px;text-align:center;
    font-size:19px;font-variant-numeric:tabular-nums;
  }

  .switch{position:relative;width:48px;height:28px;flex:none}
  .switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch span{
    position:absolute;inset:0;border-radius:999px;
    background:var(--line);pointer-events:none;transition:background .2s;
  }
  .switch span::after{
    content:"";position:absolute;top:3px;left:3px;
    width:22px;height:22px;border-radius:50%;background:var(--text);
    transition:transform .2s;
  }
  .switch input:checked + span{background:var(--cool)}
  .switch input:checked + span::after{transform:translateX(20px)}

  .ghost{
    font:inherit;font-size:14.5px;
    background:transparent;color:var(--cool);
    border:1px solid var(--line);border-radius:9px;
    padding:8px 13px;cursor:pointer;
  }

  .connect{
    width:100%;font:inherit;font-size:16px;font-weight:500;
    padding:15px;border-radius:var(--r);
    border:1px solid var(--cool);background:transparent;color:var(--cool);
    cursor:pointer;margin-bottom:22px;
  }
  .connect.busy{opacity:.5}
  .alt{
    display:block;width:100%;text-align:center;
    background:none;border:none;font:inherit;font-size:13px;
    color:var(--muted);text-decoration:underline;cursor:pointer;
    margin:-12px 0 22px;padding:4px;
  }

  details summary{
    font-size:14px;color:var(--muted);cursor:pointer;padding:6px 0;
  }
  #log{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;line-height:1.6;
    background:#0A151C;border-radius:10px;
    padding:11px;margin-top:8px;
    height:190px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;
  }
  #log .tx{color:var(--cool)}
  #log .rx{color:var(--muted)}
  #log .er{color:var(--bad)}

  .banner{
    border-radius:10px;padding:12px 14px;margin-bottom:18px;
    font-size:14px;background:#3A2410;color:#F0C489;
    border:1px solid #6B4318;
  }
  [hidden]{display:none !important}
  button:focus-visible,input:focus-visible,summary:focus-visible{
    outline:2px solid var(--cool);outline-offset:2px;
  }
  fieldset{border:none;margin:0;padding:0}
  fieldset:disabled{opacity:.45}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="clock" id="clock">
    <time id="tClock">--:--<span class="sec"></span></time>
    <span class="src"><span class="dot"></span><span id="tState">尚未連線</span></span>
  </div>

  <button class="connect" id="btnConnect">連線冷氣控制器</button>
  <button class="alt" id="btnAny" hidden>找不到？改用完整裝置清單</button>

  <div class="banner" id="banner" hidden></div>

  <fieldset id="ui" disabled>

    <div class="power">
      <button class="on"  id="btnOn"  aria-pressed="false">開冷氣</button>
      <button class="off" id="btnOff" aria-pressed="false">關冷氣</button>
    </div>

    <div class="panel">
      <div class="row">
        <div><span class="k">設定溫度</span></div>
        <div class="stepper">
          <button id="tDown" aria-label="降低溫度">−</button>
          <span class="val" id="tempVal">--°</span>
          <button id="tUp" aria-label="提高溫度">+</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <label for="onTime">每天開機</label>
        <input type="time" id="onTime" value="22:00">
      </div>
      <div class="row">
        <label for="offTime">每天關機</label>
        <input type="time" id="offTime" value="06:00">
      </div>
      <div class="row">
        <label for="schEn">排程生效
          <span class="hint" id="schHint">關閉後只能手動控制</span>
        </label>
        <span class="switch"><input type="checkbox" id="schEn"><span></span></span>
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <div><span class="k">控制器時間</span>
          <span class="hint" id="driftHint">以手機時間校正</span>
        </div>
        <button class="ghost" id="btnSync">校時</button>
      </div>
      <div class="row">
        <label for="hbEn">每秒回報時間
          <span class="hint">關閉可省藍牙流量</span>
        </label>
        <span class="switch"><input type="checkbox" id="hbEn" checked><span></span></span>
      </div>
    </div>

  </fieldset>

  <details>
    <summary>通訊紀錄</summary>
    <div id="log"></div>
  </details>
</div>

<script>
const SVC = 0xFFE0, CHR = 0xFFE1;
const ACK_TIMEOUT = 1000, MAX_TRIES = 3;

let device = null, chrRW = null, rxBuf = '';
let queue = [], pending = null, sending = false;
let lastTick = 0, deviceTime = null, temp = 27, power = false;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');

/* ---------- log ---------- */
function log(text, cls){
  const el = $('log');
  const line = document.createElement('div');
  line.className = cls || '';
  line.textContent = new Date().toLocaleTimeString('zh-TW',{hour12:false}) + '  ' + text;
  el.appendChild(line);
  while(el.children.length > 120) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
function banner(msg){
  const b = $('banner');
  if(!msg){ b.hidden = true; return; }
  b.textContent = msg; b.hidden = false;
}

/* ---------- 連線 ---------- */
async function connect(anyDevice){
  if(!navigator.bluetooth){
    banner('這個瀏覽器不支援 Web Bluetooth。請用 Android/電腦版 Chrome 開啟，iPhone 需用 Bluefy。');
    return;
  }
  const btn = $('btnConnect');
  btn.classList.add('busy'); btn.textContent = '選擇裝置…';
  try{
    const opts = anyDevice
      ? { acceptAllDevices:true, optionalServices:[SVC] }
      : { filters:[{services:[SVC]},{namePrefix:'HM'}], optionalServices:[SVC] };
    device = await navigator.bluetooth.requestDevice(opts);
    device.addEventListener('gattserverdisconnected', onDisconnect);

    btn.textContent = '連線中…';
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    chrRW = await svc.getCharacteristic(CHR);
    await chrRW.startNotifications();
    chrRW.addEventListener('characteristicvaluechanged', onNotify);

    banner(null);
    $('ui').disabled = false;
    $('btnAny').hidden = true;
    btn.textContent = '中斷連線';
    btn.classList.remove('busy');
    log('已連線 ' + (device.name || '裝置'), 'rx');

    send('6');                       // 取得目前狀態
  }catch(e){
    btn.classList.remove('busy');
    btn.textContent = '連線冷氣控制器';
    $('btnAny').hidden = false;
    if(e && e.name === 'NotFoundError') log('已取消選擇裝置','er');
    else log('連線失敗：' + (e && e.message ? e.message : e), 'er');
  }
}

function onDisconnect(){
  chrRW = null; queue = []; pending = null; sending = false;
  $('ui').disabled = true;
  $('clock').classList.remove('live');
  $('tState').textContent = '已中斷';
  $('btnConnect').textContent = '重新連線';
  $('btnConnect').classList.remove('busy');
  log('連線中斷','er');
}

/* ---------- 接收 ---------- */
function onNotify(ev){
  rxBuf += new TextDecoder().decode(ev.target.value);
  let i;
  while((i = rxBuf.search(/[\r\n]/)) >= 0){
    const line = rxBuf.slice(0,i).trim();
    rxBuf = rxBuf.slice(i+1);
    if(line) handleLine(line);
  }
  if(rxBuf.length > 200) rxBuf = '';
}

function handleLine(line){
  const p = line.split(',');
  switch(p[0]){
    case 'T':
      deviceTime = {h:+p[1], m:+p[2], s:+p[3]};
      lastTick = Date.now();
      paintClock();
      break;
    case 'ST':
      deviceTime = {h:+p[1], m:+p[2], s:+p[3]};
      lastTick = Date.now();
      $('onTime').value  = pad(+p[4]) + ':' + pad(+p[5]);
      $('offTime').value = pad(+p[6]) + ':' + pad(+p[7]);
      temp = +p[8];  paintTemp();
      $('schEn').checked = p[9] === '1';
      power = p[10] === '1'; paintPower();
      paintClock();
      log('← ' + line, 'rx');
      break;
    case 'EV':
      if(p[1]==='1'){ power = true;  paintPower(); }
      if(p[1]==='0'){ power = false; paintPower(); }
      if(p[1]==='90') banner('控制器曾經斷電，時間可能不正確。請按「校時」。');
      if(p[1]==='99') banner('控制器找不到時鐘模組，排程無法運作。');
      log('← ' + line, 'rx');
      break;
    default:
      log('← ' + line, p[0]==='ERR' ? 'er' : 'rx');
  }
  // 解除等待中的指令
  if(pending && pending.match(p)){
    clearTimeout(pending.timer);
    const ok = p[0] !== 'ERR';
    pending.done(ok);
    pending = null;
    sending = false;
    drain();
  }
}

/* ---------- 送出（一次一筆，等 ACK）---------- */
function send(cmd, onDone){
  queue.push({cmd, onDone, tries:0});
  drain();
}

async function drain(){
  if(sending || pending || !queue.length || !chrRW) return;
  sending = true;
  const job = queue[0];
  const head = job.cmd.split(',')[0];

  pending = {
    match: p => (head === '6') ? p[0]==='ST' : (p[0]==='OK'||p[0]==='ERR') && p[1]===head,
    done: ok => {
      queue.shift();
      if(job.onDone) job.onDone(ok);
    },
    timer: null
  };

  try{
    await write(job.cmd + '\n');
    log('→ ' + job.cmd, 'tx');
  }catch(e){
    log('送出失敗：' + e.message, 'er');
  }

  pending.timer = setTimeout(() => {
    pending = null; sending = false;
    job.tries++;
    if(job.tries < MAX_TRIES){
      log('沒有回覆，重送 ' + job.cmd, 'er');
    }else{
      log('放棄 ' + job.cmd + '（' + MAX_TRIES + ' 次無回應）', 'er');
      queue.shift();
      if(job.onDone) job.onDone(false);
    }
    drain();
  }, ACK_TIMEOUT);
}

// HM-10 一次最多 20 bytes，要切塊
async function write(str){
  const data = new TextEncoder().encode(str);
  for(let i=0; i<data.length; i+=20){
    const chunk = data.slice(i, i+20);
    if(chrRW.writeValueWithoutResponse) await chrRW.writeValueWithoutResponse(chunk);
    else await chrRW.writeValue(chunk);
    if(i+20 < data.length) await new Promise(r => setTimeout(r, 25));
  }
}

/* ---------- 畫面 ---------- */
function paintClock(){
  const live = deviceTime && (Date.now() - lastTick) < 4000;
  $('clock').classList.toggle('live', !!live);
  if(deviceTime){
    $('tClock').innerHTML = pad(deviceTime.h) + ':' + pad(deviceTime.m) +
      '<span class="sec">' + pad(deviceTime.s) + '</span>';
  }
  if(!chrRW) $('tState').textContent = '尚未連線';
  else if(live) $('tState').textContent = '控制器時間';
  else $('tState').textContent = deviceTime ? '時間未更新' : '等待時間回報';
}
function paintTemp(){ $('tempVal').textContent = temp + '°'; }
function paintPower(){
  $('btnOn').setAttribute('aria-pressed', power ? 'true':'false');
  $('btnOff').setAttribute('aria-pressed', power ? 'false':'true');
}

/* ---------- 操作 ---------- */
$('btnConnect').onclick = () => {
  if(chrRW && device && device.gatt.connected) device.gatt.disconnect();
  else connect(false);
};
$('btnAny').onclick = () => connect(true);

$('btnOn').onclick  = () => send('4', ok => { if(ok){ power = true;  paintPower(); } });
$('btnOff').onclick = () => send('5', ok => { if(ok){ power = false; paintPower(); } });

$('tUp').onclick   = () => changeTemp(+1);
$('tDown').onclick = () => changeTemp(-1);
let tempTimer = null;
function changeTemp(d){
  const next = Math.min(30, Math.max(16, temp + d));
  if(next === temp) return;
  temp = next; paintTemp();
  clearTimeout(tempTimer);                 // 連按只送最後一次
  tempTimer = setTimeout(() => send('3,' + temp), 400);
}

$('onTime').onchange = e => {
  const [h,m] = e.target.value.split(':');
  send('1,' + (+h) + ',' + (+m));
};
$('offTime').onchange = e => {
  const [h,m] = e.target.value.split(':');
  send('2,' + (+h) + ',' + (+m));
};
$('schEn').onchange = e => send('8,' + (e.target.checked ? 1 : 0));
$('hbEn').onchange  = e => send('9,' + (e.target.checked ? 1 : 0));

$('btnSync').onclick = () => {
  const d = new Date();
  send([7, d.getFullYear(), d.getMonth()+1, d.getDate(),
        d.getHours(), d.getMinutes(), d.getSeconds()].join(','),
       ok => { if(ok){ banner(null); send('6'); } });
};

/* 本機補秒，讓時鐘不會卡住 */
setInterval(() => {
  if(deviceTime && Date.now() - lastTick > 1200 && Date.now() - lastTick < 4000){
    const t = new Date(2000,0,1,deviceTime.h,deviceTime.m,deviceTime.s + 1);
    deviceTime = {h:t.getHours(), m:t.getMinutes(), s:t.getSeconds()};
    lastTick += 1000;
  }
  paintClock();
}, 500);

paintClock();
</script>
</body>
</html>
